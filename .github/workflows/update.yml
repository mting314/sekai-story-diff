name: Check for a new asset version

# There is nothing to subscribe to: Colorful Palette publish no feed, and their public
# version endpoint returns only the assetbundle host handshake. Sekai-World get the
# version by running an authenticated game client on a timer, so we poll the file that
# client produces. Their bot commits mostly at 07:30 UTC, so run shortly after — a
# release then lands here within the hour rather than drifting up to a day behind.
on:
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  detect:
    name: Detect and diff
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # the base set only: live2d-py has no Linux wheel, and detection does not render
      - run: uv sync

      - name: Is there a new asset version?
        id: check
        # exit 10 means "new"; anything else non-zero is a real failure
        run: |
          set +e
          uv run python scripts/check_new_version.py --github
          code=$?
          set -e
          if [ "$code" != "0" ] && [ "$code" != "10" ]; then exit "$code"; fi

      - name: Index it
        if: steps.check.outputs.new == 'true'
        run: |
          uv run python scripts/build_version_index.py --append \
            "${{ steps.check.outputs.version }}" "${{ steps.check.outputs.hash }}" \
            "$(date -u +%F)"

      # 211 one-byte probes for a new release, and every cell is immutable so nothing
      # already known is re-fetched
      - name: Fingerprint the new release
        if: steps.check.outputs.new == 'true'
        run: uv run python scripts/fingerprint_bundles.py --workers 4

      - name: Confirm candidates by diffing them
        id: diff
        if: steps.check.outputs.new == 'true'
        run: |
          before=$(ls data/transitions/*.json 2>/dev/null | wc -l | tr -d ' ')
          uv run python scripts/diff_transitions.py
          after=$(ls data/transitions/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "changed=$([ "$after" -gt "$before" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$before -> $after confirmed transitions"

      # Commit even when nothing changed: the fingerprints and the version index moved,
      # and — more importantly — GitHub disables scheduled workflows after 60 days of
      # repository inactivity. 18 of 41 releases changed nothing, so without this the
      # scheduler could switch itself off during a quiet stretch, silently.
      - name: Record what we learned
        if: steps.check.outputs.new == 'true'
        run: |
          git config user.name "sekai-story-diff bot"
          git config user.email "actions@github.com"
          git add data/versions_en.json data/fingerprints.json data/transitions.json \
                  data/transitions data/versions_etag.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Index asset version ${{ steps.check.outputs.version }}"
          git push

      - name: Heartbeat so the scheduler is not disabled
        if: steps.check.outputs.new != 'true'
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date -u +%s) - last) / 86400 ))
          echo "last commit was $age days ago"
          if [ "$age" -ge 30 ]; then
            git config user.name "sekai-story-diff bot"
            git config user.email "actions@github.com"
            date -u +%FT%TZ > data/last_checked.txt
            git add data/last_checked.txt
            git commit -m "Heartbeat: still watching for new asset versions"
            git push
          fi

  render:
    name: Render and publish
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    # Windows, not Linux: live2d-py ships no Linux wheel and its CMakeLists has no
    # Linux branch, so the Cubism binding cannot be built there. A GitHub-hosted
    # Windows runner is free for public repos, which is why this needs no VM.
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write   # for Workload Identity Federation; no key is stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group render

      # The runner has no GPU and Windows' fallback is OpenGL 1.1, which cannot compile
      # Cubism's #version 120 shaders. Mesa's llvmpipe gives a 4.5 *compatibility*
      # profile, which can. It must sit next to python.exe — Windows resolves
      # opengl32.dll from the executable's directory, not the working directory.
      - name: Install Mesa software GL
        run: |
          curl -L -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/25.0.3/mesa3d-25.0.3-release-msvc.7z
          7z x mesa.7z -omesa
          $py = Split-Path (Get-Command python).Source
          $dll = Get-ChildItem -Recurse mesa -Filter opengl32.dll |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $dll) { throw "no x64 opengl32.dll in the Mesa archive" }
          Copy-Item $dll.FullName -Destination $py -Force
          Get-ChildItem -Recurse mesa -Filter "libgallium_wgl.dll" |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 |
            ForEach-Object { Copy-Item $_.FullName -Destination $py -Force }
          echo "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV

      # Models are ~3 MB each and motions are fetched one file at a time, so a cold
      # cache turns a two-minute render into a long one and hammers the mirror.
      - name: Cache Live2D models, motions and media
        uses: actions/cache@v4
        with:
          path: |
            data/live2d
            data/media
            data/jp_assets
            data/official
          key: live2d-${{ runner.os }}-${{ hashFiles('data/transitions.json') }}
          restore-keys: live2d-${{ runner.os }}-

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/1067538977979/locations/global/workloadIdentityPools/github/providers/mting314"
          service_account: "sekai-diff-ci@sekai-story-indexer.iam.gserviceaccount.com"
      - uses: google-github-actions/setup-gcloud@v2

      # Sprites are no longer in the repo, so without this a fresh runner would treat
      # every pose as new and redraw all of them instead of the release's handful.
      - name: Pull existing media
        run: gcloud storage rsync gs://sekai-story-diff-assets web/public --recursive --quiet

      # data/official is 543 MB and untracked, so a cold cache has none of it. Only the
      # 62 files the payloads actually reference are needed, not the whole thing.
      - name: Ensure the scenario data the build reads
        run: uv run python scripts/ensure_scenarios.py

      - name: Render
        run: |
          uv run python scripts/build_web_gallery.py --changes "data/official_changes.json" "data/official_changes_*.json" "data/transitions/*.json"

      # Refuse to publish a payload whose sprites are missing: with "hide until
      # rendered" a partial deploy looks identical to a healthy site.
      - name: Every referenced sprite must exist
        run: uv run python scripts/verify_payload.py

      # Upload before committing: the payload must never reference a sprite that is
      # not yet fetchable. Immutable caching is only safe because the filenames are
      # hashes of the bytes.
      - name: Upload new media
        run: |
          gcloud storage rsync web/public gs://sekai-story-diff-assets --recursive --quiet
          gcloud storage objects update "gs://sekai-story-diff-assets/**" --cache-control="public, max-age=31536000, immutable" --quiet

      - name: Commit and publish
        run: |
          git config user.name "sekai-story-diff bot"
          git config user.email "actions@github.com"
          git add web/src/data.json
          if (git diff --cached --quiet) { echo "nothing new to publish" } else {
            git commit -m "Render ${{ needs.detect.outputs.version }}"
            git push
          }

  report-failure:
    name: Report failure
    needs: [detect, render]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      # With "hide until rendered", a silent failure means the site quietly
      # under-reports while looking perfectly healthy. Never fail quietly.
      - uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...context.repo,
              title: `Auto-update failed for ${{ needs.detect.outputs.version || 'unknown version' }}`,
              body: `The scheduled update run failed.\n\n${url}\n\n`
                  + `The site hides changed lines until their scenes are rendered, so until `
                  + `this is fixed it under-reports what changed.`,
              labels: ["automation"],
            });
